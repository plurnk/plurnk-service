# plurnk-service behind nginx: an example to adapt, never installed by the package.
# TLS, security headers, edge authentication (e.g. oauth2-proxy / Authelia `auth_request`), and
# network allow-lists belong here in front of `127.0.0.1:1066`, or configure an external OIDC
# provider on the daemon (`PLURNK_AUTH_ISSUER`, `PLURNK_AUTH_CLIENT_ID`, `PLURNK_AUTH_USERS`).
#
# Install:  cp "$(npm root -g)/@plurnk/plurnk-service/plurnk.nginx.conf" /etc/nginx/conf.d/plurnk.conf
#           replace plurnk.example.com and the certificate paths, then: nginx -t && systemctl reload nginx
# Certificates: certbot --nginx -d plurnk.example.com, or any certificate you hold.
# The daemon: keep it on loopback (the default PLURNK_HOST=127.0.0.1) so nginx is the one way in.
# nginx older than 1.25.1: drop `http2 on;` and write `listen 443 ssl http2;` instead.

server {
    listen 80;
    listen [::]:80;
    server_name plurnk.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name plurnk.example.com;

    ssl_certificate     /etc/letsencrypt/live/plurnk.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/plurnk.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:plurnk_tls:10m;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Content-Type-Options nosniff always;
    proxy_hide_header X-Frame-Options;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    # Optional: admit only your own networks, or configure `auth_request` for edge SSO.
    # allow 192.168.1.0/24;
    # allow 10.0.0.0/8;
    # deny all;

    # Messages and their attachments arrive in request bodies.
    client_max_body_size 64m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Upgrade $http_upgrade;

    location / {
        proxy_pass http://127.0.0.1:1066;
        # ACP and /notifications stream over WebSockets and SSE: disable proxy buffering.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      "";
}
