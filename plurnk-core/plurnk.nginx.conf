# plurnk-service behind nginx: an example to adapt, never installed by the package.
# The daemon answers whoever reaches it at whatever address they used and refuses nobody for it.
# TLS, security headers, sign-in throttling and network allow-lists belong here, in front of it.
#
# Install:  cp "$(npm root -g)/@plurnk/plurnk-service/plurnk.nginx.conf" /etc/nginx/conf.d/plurnk.conf
#           replace plurnk.example.com and the certificate paths, then: nginx -t && systemctl reload nginx
# Certificates: certbot --nginx -d plurnk.example.com, or any certificate you hold.
# The daemon: keep it on loopback (the default PLURNK_HOST=127.0.0.1) so nginx is the one way in, and
#           tell it the public origin, which it cannot see through the TLS in front of it:
#           PLURNK_AUTH_ISSUER=https://plurnk.example.com in ~/.config/plurnk/.env, and
#           PLURNK_A2A_ENDPOINT_URL=https://plurnk.example.com/a2a when PLURNK_A2A_EXPOSE=1.
# nginx older than 1.25.1: drop `http2 on;` and write `listen 443 ssl http2;` instead.

# Sign-in throttling, per real client address: the daemon behind nginx sees only nginx's.
limit_req_zone $binary_remote_addr zone=plurnk_signin:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name plurnk.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name plurnk.example.com;

    ssl_certificate     /etc/letsencrypt/live/plurnk.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/plurnk.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:plurnk_tls:10m;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Content-Type-Options nosniff always;
    proxy_hide_header X-Frame-Options;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    # Optional: admit only your own networks.
    # allow 192.168.1.0/24;
    # allow 10.0.0.0/8;
    # deny all;

    # Messages and their attachments arrive in request bodies.
    client_max_body_size 64m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";

    location / {
        proxy_pass http://127.0.0.1:1066;
        # ACP answers over server-sent events: a buffered or timed-out stream looks like a hang.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # The browser sign-in form takes the operator's password.
    location = /oauth/authorize {
        limit_req zone=plurnk_signin burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:1066;
    }
}
